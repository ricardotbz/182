<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1d2433">Laboraufbau: Wazuh-Monitoring in VMware Workstation Pro 17</text>

  <!-- Host -->
  <rect x="30" y="58" width="840" height="452" rx="10" fill="#f6f7f9" stroke="#b9c0cc" stroke-width="2"/>
  <text x="50" y="84" font-size="15" font-weight="600" fill="#3c444a">Windows-Host (Arbeitsgerät)</text>
  <text x="50" y="104" font-size="12" fill="#68707d">VMware Workstation Pro 17 · Browser · SSH-Client</text>

  <!-- Browser box -->
  <rect x="50" y="120" width="200" height="70" rx="8" fill="#ffffff" stroke="#8a93a3" stroke-width="1.5"/>
  <text x="150" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2433">Browser</text>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#68707d">https://&lt;WAZUH_IP&gt;</text>

  <!-- NAT segment -->
  <rect x="50" y="214" width="800" height="274" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="68" y="238" font-size="14" font-weight="600" fill="#2f5fc4">Virtuelles Netz VMnet8 (NAT)</text>
  <text x="68" y="256" font-size="11" fill="#68707d">beide VMs im selben Subnetz – sonst kein Agent-Enrollment</text>

  <!-- Wazuh Server VM -->
  <rect x="90" y="286" width="300" height="172" rx="8" fill="#eef3ff" stroke="#2f5fc4" stroke-width="2"/>
  <text x="240" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2433">VM «Wazuh-Server»</text>
  <text x="240" y="334" text-anchor="middle" font-size="11" fill="#68707d">Amazon Linux 2023 · OVA 4.14.7</text>
  <line x1="110" y1="346" x2="370" y2="346" stroke="#c3cfe8" stroke-width="1"/>
  <text x="240" y="368" text-anchor="middle" font-size="12" fill="#3c444a">wazuh-manager (Analyse, Regeln)</text>
  <text x="240" y="390" text-anchor="middle" font-size="12" fill="#3c444a">wazuh-indexer (Datenhaltung)</text>
  <text x="240" y="412" text-anchor="middle" font-size="12" fill="#3c444a">wazuh-dashboard (Web-UI)</text>
  <text x="240" y="440" text-anchor="middle" font-size="11" fill="#68707d">IP: 192.168.179.129</text>

  <!-- Ubuntu VM -->
  <rect x="510" y="286" width="300" height="172" rx="8" fill="#fff3ec" stroke="#d2691e" stroke-width="2"/>
  <text x="660" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2433">VM «Ubuntu-Endpunkt»</text>
  <text x="660" y="334" text-anchor="middle" font-size="11" fill="#68707d">Ubuntu 24.04.2 Desktop</text>
  <line x1="530" y1="346" x2="790" y2="346" stroke="#eccbb4" stroke-width="1"/>
  <text x="660" y="368" text-anchor="middle" font-size="12" fill="#3c444a">wazuh-agent 4.14.7</text>
  <text x="660" y="390" text-anchor="middle" font-size="12" fill="#3c444a">SCA · FIM · Syscollector</text>
  <text x="660" y="412" text-anchor="middle" font-size="12" fill="#3c444a">Active Response (iptables)</text>
  <text x="660" y="440" text-anchor="middle" font-size="11" fill="#68707d">IP: 192.168.179.128</text>

  <!-- Arrows agent -> server -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3c444a"/>
    </marker>
  </defs>
  <line x1="508" y1="360" x2="394" y2="360" stroke="#3c444a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="451" y="352" text-anchor="middle" font-size="11" fill="#3c444a">1515/tcp</text>
  <text x="451" y="378" text-anchor="middle" font-size="10" fill="#68707d">Enrollment</text>

  <line x1="508" y1="408" x2="394" y2="408" stroke="#3c444a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="451" y="400" text-anchor="middle" font-size="11" fill="#3c444a">1514/tcp</text>
  <text x="451" y="426" text-anchor="middle" font-size="10" fill="#68707d">Events (verschlüsselt)</text>

  <!-- Browser -> dashboard -->
  <path d="M150,192 L150,246 L150,300 L86,300" fill="none" stroke="#2f5fc4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="196" y="232" font-size="11" fill="#2f5fc4">443/tcp</text>

  <!-- Blind spot note -->
  <rect x="90" y="470" width="720" height="0" fill="none"/>
  <text x="450" y="504" text-anchor="middle" font-size="12" fill="#a33">Nicht überwacht: Windows-Host selbst, Netzwerkverkehr zwischen den VMs, alle Geräte ohne Agent</text>
</svg>
