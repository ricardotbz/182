<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3c444a"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1d2433">Vom Ereignis zum Alarm – und wo aus dem HIDS ein HIPS wird</text>

  <!-- Row 1 -->
  <rect x="30" y="80" width="170" height="86" rx="8" fill="#fff3ec" stroke="#d2691e" stroke-width="2"/>
  <text x="115" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2433">1 · Ereignis</text>
  <text x="115" y="132" text-anchor="middle" font-size="11" fill="#68707d">Fehlgeschlagener</text>
  <text x="115" y="148" text-anchor="middle" font-size="11" fill="#68707d">SSH-Login (journald)</text>

  <rect x="240" y="80" width="170" height="86" rx="8" fill="#fff3ec" stroke="#d2691e" stroke-width="2"/>
  <text x="325" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2433">2 · Agent</text>
  <text x="325" y="132" text-anchor="middle" font-size="11" fill="#68707d">sammelt und sendet</text>
  <text x="325" y="148" text-anchor="middle" font-size="11" fill="#68707d">verschlüsselt (1514/tcp)</text>

  <rect x="450" y="80" width="170" height="86" rx="8" fill="#eef3ff" stroke="#2f5fc4" stroke-width="2"/>
  <text x="535" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2433">3 · Decoder</text>
  <text x="535" y="132" text-anchor="middle" font-size="11" fill="#68707d">zerlegt die Logzeile</text>
  <text x="535" y="148" text-anchor="middle" font-size="11" fill="#68707d">in Felder (srcip, user)</text>

  <rect x="660" y="80" width="210" height="86" rx="8" fill="#eef3ff" stroke="#2f5fc4" stroke-width="2"/>
  <text x="765" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2433">4 · Regel</text>
  <text x="765" y="132" text-anchor="middle" font-size="11" fill="#68707d">5760 → eigene Regel 100100</text>
  <text x="765" y="148" text-anchor="middle" font-size="11" fill="#68707d">Level 10, 5× in 60 s</text>

  <line x1="202" y1="123" x2="236" y2="123" stroke="#3c444a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="412" y1="123" x2="446" y2="123" stroke="#3c444a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="622" y1="123" x2="656" y2="123" stroke="#3c444a" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Row 2 -->
  <rect x="240" y="250" width="200" height="96" rx="8" fill="#eef3ff" stroke="#2f5fc4" stroke-width="2"/>
  <text x="340" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2433">5 · Alarm</text>
  <text x="340" y="302" text-anchor="middle" font-size="11" fill="#68707d">ab log_alert_level im</text>
  <text x="340" y="318" text-anchor="middle" font-size="11" fill="#68707d">Dashboard sichtbar</text>
  <text x="340" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#2f5fc4">= HIDS (erkennen)</text>

  <rect x="530" y="250" width="240" height="96" rx="8" fill="#fdecec" stroke="#c23b3b" stroke-width="2"/>
  <text x="650" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2433">6 · Active Response</text>
  <text x="650" y="302" text-anchor="middle" font-size="11" fill="#68707d">firewall-drop sperrt die</text>
  <text x="650" y="318" text-anchor="middle" font-size="11" fill="#68707d">Quell-IP via iptables</text>
  <text x="650" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#c23b3b">= HIPS (verhindern)</text>

  <path d="M765,168 L765,210 L340,210 L340,246" fill="none" stroke="#3c444a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="442" y1="298" x2="526" y2="298" stroke="#c23b3b" stroke-width="2" marker-end="url(#a2)"/>

  <text x="450" y="392" text-anchor="middle" font-size="12" fill="#68707d">Die Grenze verläuft zwischen Schritt 5 und 6: Ein Alarm blockiert nichts. Erst die hinterlegte Reaktion greift ein.</text>
  <text x="450" y="412" text-anchor="middle" font-size="12" fill="#68707d">Preis dafür: Eine falsch ausgelöste Regel sperrt echte Benutzer aus.</text>
</svg>
